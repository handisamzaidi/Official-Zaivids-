
name: Build Zaidi Videos Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Zaivids project
        run: |
          unzip -q zaivids-capacitor-starter.zip -d /tmp/zaivids
          PROJECT_DIR=$(find /tmp/zaivids -name package.json -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          cp -R "$PROJECT_DIR"/. .

      - name: Configure Node modules
        run: npm pkg set type=module

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install --save-dev typescript

      - name: Fix Capacitor config import
        run: |
          sed -i "s/import { CapacitorConfig }/import type { CapacitorConfig }/" capacitor.config.ts

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Install ZAIDI VIDEOS icon
        run: |
          unzip -q zaidi-videos-android-icons.zip -d /tmp/zaidi-icons
          cp -R /tmp/zaidi-icons/res/. android/app/src/main/res/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAIDI-VIDEOS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
